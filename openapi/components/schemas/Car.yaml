# models/Car.js — a car serves its provider's serviceRegions (no region of its own)
components:
  schemas:
    Car:
      type: object
      required: [brand, model, licensePlate, dailyRate]
      properties:
        _id: { type: string, readOnly: true, example: 665f1c2ab3d4e5f6a7b8c9d2 }
        provider:
          readOnly: true
          description: Provider id (from the URL), or the populated provider on GET.
          oneOf:
            - { type: string }
            - { $ref: '#/components/schemas/Provider' }
        brand: { type: string, example: Toyota }
        model: { type: string, example: Camry }
        licensePlate: { type: string, description: Unique across all cars, example: 1กข-1234 }
        type: { type: string, enum: [sedan, suv, hatchback, van, pickup] }
        seats: { type: integer, minimum: 2, maximum: 15, example: 5 }
        dailyRate: { type: number, minimum: 0.01, example: 1500 }
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }
