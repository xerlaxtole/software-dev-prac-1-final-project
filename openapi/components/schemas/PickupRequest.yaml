# models/PickupRequest.js — one per booking; a rejected one is replaced by the next request
components:
  schemas:
    PickupRequest:
      type: object
      required: [name, address]
      properties:
        _id: { type: string, readOnly: true, example: 665f1c2ab3d4e5f6a7b8c9d5 }
        booking:
          readOnly: true
          description: Booking id (from the URL). Populated when listed by provider.
          oneOf:
            - { type: string }
            - { $ref: '#/components/schemas/Booking' }
        user:
          readOnly: true
          description: User id. Populated (name, tel, email) when listed by provider.
          oneOf:
            - { type: string }
            - { $ref: '#/components/schemas/User' }
        provider: { type: string, readOnly: true }
        name: { type: string, example: My condo }
        address: { type: string, example: 88 Phahonyothin Rd, Bangkok }
        region: { type: string, description: Optional. One of the provider's service regions., example: Bangkok }
        status: { type: string, enum: [pending, approved, rejected], default: pending, readOnly: true }
        reviewNote: { type: string, readOnly: true }
        reviewedAt: { type: string, format: date-time, readOnly: true }
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }
