# models/User.js
components:
  schemas:
    User:
      type: object
      required: [name, tel, email, password]
      properties:
        _id: { type: string, readOnly: true, example: 665f1c2ab3d4e5f6a7b8c9d0 }
        name: { type: string, example: Somchai Jaidee }
        tel: { type: string, pattern: '^0[0-9]{8,9}$', example: '0812345678' }
        email: { type: string, format: email, example: somchai@example.com }
        password: { type: string, format: password, minLength: 6, writeOnly: true, example: '123456' }
        role:
          type: string
          enum: [user, provider, admin]
          default: user
          description: Register accepts `user` or `provider` only (`admin` → 403).
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }
