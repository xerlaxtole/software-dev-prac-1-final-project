# models/Booking.js — max 3 per user and the overlap check live in controllers/bookings.js
components:
  schemas:
    Booking:
      type: object
      required: [startDate, endDate]
      properties:
        _id: { type: string, readOnly: true, example: 665f1c2ab3d4e5f6a7b8c9d4 }
        user: { type: string, readOnly: true, description: The logged-in user }
        car:
          description: Set from the URL on create; can be changed on update. Populated (brand, model…) on GET.
          oneOf:
            - { type: string }
            - { $ref: '#/components/schemas/Car' }
        provider:
          readOnly: true
          description: Copied from the car. Populated (name, address, tel) on GET.
          oneOf:
            - { type: string }
            - { $ref: '#/components/schemas/Provider' }
        startDate:
          type: string
          format: date
          description: Today or later. Same-day rental (startDate = endDate) is allowed.
          example: '2026-12-20'
        endDate: { type: string, format: date, description: On or after startDate, example: '2026-12-23' }
        pickupLocation:
          type: string
          nullable: true
          description: Optional. A pick-up location of the car's provider.
        pickupRequest: { type: string, nullable: true, readOnly: true }
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }
