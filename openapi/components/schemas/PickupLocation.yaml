# models/PickupLocation.js — region must be one of the provider's serviceRegions (checked in the controller)
components:
  schemas:
    PickupLocation:
      type: object
      properties:
        _id: { $ref: '#/components/schemas/ObjectId' }
        provider:
          description: Provider id, or the populated provider on GET.
          oneOf:
            - { $ref: '#/components/schemas/ObjectId' }
            - { $ref: '#/components/schemas/Provider' }
        name: { type: string, description: Unique per provider, example: Siam Paragon }
        address: { type: string, example: 991 Rama I Rd, Pathum Wan, Bangkok }
        region: { type: string, example: Bangkok }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PickupLocationInput:
      type: object
      required: [name, address, region]
      properties:
        name: { type: string, example: Siam Paragon }
        address: { type: string, example: 991 Rama I Rd, Pathum Wan, Bangkok }
        region: { type: string, example: Bangkok }
    PickupLocationUpdateInput:
      type: object
      properties:
        name: { type: string }
        address: { type: string }
        region: { type: string }
    PickupLocationResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { $ref: '#/components/schemas/PickupLocation' }
    PickupLocationList:
      type: object
      properties:
        success: { type: boolean, example: true }
        count: { type: integer }
        data:
          type: array
          items: { $ref: '#/components/schemas/PickupLocation' }
