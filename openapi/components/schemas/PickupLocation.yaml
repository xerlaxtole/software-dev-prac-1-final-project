# models/PickupLocation.js — region must be one of the provider's serviceRegions (checked in the controller)
components:
  schemas:
    PickupLocation:
      type: object
      required: [name, address, region]
      properties:
        _id: { type: string, readOnly: true, example: 665f1c2ab3d4e5f6a7b8c9d3 }
        provider:
          readOnly: true
          description: Provider id (from the URL), or the populated provider on GET.
          oneOf:
            - { type: string }
            - { $ref: '#/components/schemas/Provider' }
        name: { type: string, description: Unique per provider, example: Siam Paragon }
        address: { type: string, example: 991 Rama I Rd, Pathum Wan, Bangkok }
        region: { type: string, description: One of the provider's service regions, example: Bangkok }
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }
