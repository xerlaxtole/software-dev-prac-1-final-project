# models/Provider.js
components:
  schemas:
    Provider:
      type: object
      required: [name, address, tel]
      properties:
        _id: { type: string, readOnly: true, example: 665f1c2ab3d4e5f6a7b8c9d1 }
        name: { type: string, maxLength: 100, description: Unique, example: Bangkok Car Rental }
        address: { type: string, example: 123 Sukhumvit Rd, Bangkok }
        tel: { type: string, example: '021234567' }
        owner:
          type: string
          description: User id of the provider account. Set automatically for a provider; admin passes it on create.
        serviceRegions:
          type: array
          items: { type: string }
          description: Valid, unique province names. Set on create; change later with the /regions endpoints.
          example: [Bangkok, Chonburi]
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }
