# models/Provider.js
components:
  schemas:
    Provider:
      type: object
      properties:
        _id: { $ref: '#/components/schemas/ObjectId' }
        name: { type: string, maxLength: 100, example: Bangkok Car Rental }
        address: { type: string, example: 123 Sukhumvit Rd, Bangkok }
        tel: { type: string, example: '021234567' }
        owner: { $ref: '#/components/schemas/ObjectId' }
        serviceRegions:
          type: array
          items: { type: string }
          example: [Bangkok, Chonburi]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProviderInput:
      type: object
      required: [name, address, tel]
      properties:
        name: { type: string, maxLength: 100, example: Bangkok Car Rental }
        address: { type: string, example: 123 Sukhumvit Rd, Bangkok }
        tel: { type: string, example: '021234567' }
        serviceRegions:
          type: array
          items: { type: string }
          description: Unique, valid province names. Only on create; use the /regions sub-routes afterwards.
          example: [Bangkok]
        owner:
          allOf: [{ $ref: '#/components/schemas/ObjectId' }]
          description: Admin only. A provider account always owns what it creates.
    ProviderUpdateInput:
      type: object
      description: Only name / address / tel can change here.
      properties:
        name: { type: string, maxLength: 100 }
        address: { type: string }
        tel: { type: string }
    ProviderResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { $ref: '#/components/schemas/Provider' }
    ProviderList:
      type: object
      properties:
        success: { type: boolean, example: true }
        count: { type: integer }
        pagination: { $ref: '#/components/schemas/Pagination' }
        data:
          type: array
          items: { $ref: '#/components/schemas/Provider' }
