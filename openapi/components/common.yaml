# Shared pieces used by every paths/*.yaml file: auth, path/query params, standard error responses.
# Every error body is { "success": false, "message": "..." }.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token from POST /auth/register or POST /auth/login.
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
      description: httpOnly cookie set by register / login (same JWT).

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, example: 665f1c2ab3d4e5f6a7b8c9d0 }
    ProviderId:
      name: providerId
      in: path
      required: true
      schema: { type: string, example: 665f1c2ab3d4e5f6a7b8c9d1 }
    CarId:
      name: carId
      in: path
      required: true
      schema: { type: string, example: 665f1c2ab3d4e5f6a7b8c9d2 }
    BookingId:
      name: bookingId
      in: path
      required: true
      schema: { type: string, example: 665f1c2ab3d4e5f6a7b8c9d4 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, default: 25 }
    Region:
      name: region
      in: query
      description: English province name from GET /regions (unknown name → 400).
      schema: { type: string, example: Bangkok }

  responses:
    BadRequest:
      description: Invalid id, body or query
    Unauthorized:
      description: Missing, invalid or expired token
    Forbidden:
      description: Role not allowed, or not the owner of this resource
    NotFound:
      description: Resource not found
    Conflict:
      description: Conflicts with existing data
    ServerError:
      description: Unexpected server error
    Deleted:
      description: 'Deleted — { "success": true, "data": {} }'
    Csv:
      description: CSV file download (Content-Disposition attachment)
      content:
        text/csv:
          schema: { type: string }
